<div
  class="min-h-screen bg-linear-to-br from-blue-50 via-white to-blue-100 flex items-center justify-center px-4"
>
  <div class="w-full max-w-md">
    <!-- Logo / Brand -->
    <div class="text-center mb-8">
      <a
        routerLink="/"
        class="inline-flex items-center gap-2 text-blue-600 font-extrabold text-2xl"
      >
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center">
          <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
            <path
              d="M3 1a1 1 0 000 2h1.22l.305 1.222a.997.997 0 00.01.042l1.358 5.43-.893.892C3.74 11.846 4.632 14 6.414 14H15a1 1 0 000-2H6.414l1-1H14a1 1 0 00.894-.553l3-6A1 1 0 0017 3H6.28l-.31-1.243A1 1 0 005 1H3zM16 16.5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zM6.5 18a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"
            />
          </svg>
        </div>
        SRIStore
      </a>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <!-- Heading -->
      <div class="flex items-center gap-2 mb-7">
        <div>
          <h1 class="text-lg font-bold text-gray-800">Admin Login</h1>
          <p class="text-xs text-gray-400">Store management access only</p>
        </div>
      </div>

      <!-- Login Form -->
      <!-- #loginForm="ngForm" creates a template reference to the NgForm instance,
           allowing us to pass it to handleLogin() on submit -->
      <!-- novalidate disables browser's built-in validation so Angular handles it instead -->
      <form #loginForm="ngForm" (ngSubmit)="handleLogin(loginForm)" novalidate>
        <!-- Username -->
        <div class="mb-5">
          <label for="username" class="block text-sm font-semibold text-gray-700 mb-1.5">
            Username
          </label>
          <input
            id="username"
            type="text"
            name="username"
            ngModel
            required
            placeholder="Admin username"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-400 transition"
          />
        </div>

        <!-- Password -->
        <div class="mb-6">
          <label for="password" class="block text-sm font-semibold text-gray-700 mb-1.5">
            Password
          </label>
          <input
            id="password"
            type="password"
            name="password"
            ngModel
            required
            placeholder="Admin password"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-400 transition"
          />
        </div>

        <!-- Error message — rendered only after a failed login attempt -->
        @if (loginFailed()) {
          <div
            class="mb-5 bg-red-50 border border-red-200 text-red-600 text-sm font-medium px-4 py-3 rounded-xl flex items-center gap-2"
          >
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0
                       001.71-3L13.71 3.86a2 2 0 00-3.42 0z"
              />
            </svg>
            Invalid credentials. Please check your username and password.
          </div>
        }

        <!-- Submit -->
        <!-- [disabled]="loading()" prevents double-submission while the request is in-flight.
             @if swaps the button label for a spinner during that time -->
        <button
          type="submit"
          [disabled]="loading()"
          class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] disabled:opacity-60 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2"
        >
          @if (loading()) {
            <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              />
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
              />
            </svg>
            Signing in…
          } @else {
            Sign In
          }
        </button>
      </form>
    </div>

    <!-- Back to store -->
    <p class="text-center text-sm text-gray-400 mt-5">
      <a routerLink="/" class="text-blue-500 hover:text-blue-600 font-medium transition-colors">
        ← Back to Store
      </a>
    </p>
  </div>
</div>
